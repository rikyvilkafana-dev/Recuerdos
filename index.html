<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayuri ✨</title>

  <!-- CSS -->
  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <!-- 🌼 EFECTOS FLOTANTES -->
  <div class="effects"></div>

  <!-- ✨ TÍTULO -->
  <h1 id="titulo">SAYURI</h1>

  <!-- 🎵 REPRODUCTOR DE MÚSICA -->
  <div class="music-player">

    <!-- portada pequeña -->
    <img src="fotos/cover.jpg" class="music-cover" alt="cover">

    <div class="music-info">
      <p id="song-name" class="music-title">Canción 1</p>

      <div class="controls">
        <button onclick="prev()">⏮</button>
        <button onclick="togglePlay()">▶</button>
        <button onclick="next()">⏭</button>
      </div>
    </div>

    <audio id="audio"></audio>
  </div>

  <!-- 💌 FRASE -->
  <p class="love-phrase">
    No sé en qué momento, pero te volviste mi lugar seguro
  </p>

  <!-- 💖 NOMBRE -->
  <h2 class="name">Sayuri</h2>

  <!-- 📸 ÁLBUM DESLIZABLE -->
  <div class="album">
    <img id="foto" src="fotos/1.jpg" alt="foto">
  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
